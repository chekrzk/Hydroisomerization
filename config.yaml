diffusion:
  model: knudsen
  phase_compatibility: gas_demo_only
  calculate_effective_diffusivity: true
  formula: "Deff_i=(porosity/tortuosity)*(2/3)*pore_radius*sqrt(8*R*T/(pi*M_i))"
  reference_effective_diffusivity:
    C1:  {value: 6.12946e-8, unit: m^2/s, <<: *calculated}
    C2:  {value: 6.12946e-8, unit: m^2/s, <<: *calculated}
    C3:  {value: 6.12946e-8, unit: m^2/s, <<: *calculated}
    C4:  {value: 6.49612e-7, unit: m^2/s, <<: *calculated}
    C5:  {value: 1.20986e-7, unit: m^2/s, <<: *calculated}
    C6:  {value: 7.73236e-8, unit: m^2/s, <<: *calculated}
    C7:  {value: 6.15685e-8, unit: m^2/s, <<: *calculated}
    C8:  {value: 6.14304e-8, unit: m^2/s, <<: *calculated}
    C9:  {value: 6.14304e-8, unit: m^2/s, <<: *calculated}
    C10: {value: 6.14304e-8, unit: m^2/s, <<: *calculated}
    C11: {value: 1.23134e-7, unit: m^2/s, <<: *calculated}
    C12: {value: 7.75995e-8, unit: m^2/s, <<: *calculated}
    C13: {value: 6.15685e-8, unit: m^2/s, <<: *calculated}
    C14: {value: 6.15685e-8, unit: m^2/s, <<: *calculated}
    C15: {value: 7.78783e-8, unit: m^2/s, <<: *calculated}

