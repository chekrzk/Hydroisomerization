initial_conditions:
  model: bulk_equilibrated
  profile_type: uniform
  concentrations_from: bulk

numerics:
  spatial:
    method: finite_volume
    geometry: radial_cylinder
    radial_cells: 100
    grid: uniform
  time:
    mode: transient
    start_time: {value: 0.0, unit: s}
    end_time: {value: 3600.0, unit: s}
    output_interval: {value: 5.0, unit: s}
  solver:
    backend: cvode
    method: bdf
    rtol: 1.0e-9
    atol: {value: 1.0e-12, unit: mol/m^3}
    max_steps: 100000
    initial_step: {value: 1.0e-6, unit: s}
    max_step: {value: 15.0, unit: s}
    jacobian_mode: finite_difference
    linear_solver: dense
  steady_state:
    derivative_tolerance: {value: 1.0e-10, unit: mol/(m^3*s)}
    maximum_time: {value: 1.0e+7, unit: s}

nonnegativity:
  warning_tolerance: {value: 1.0e-11, unit: mol/m^3}
  error_tolerance: {value: 1.0e-8, unit: mol/m^3}
  clamp_negative_values: false

validation:
  material_balance: true
  carbon_balance: true
  hydrogen_balance: true
  warn_for_ambiguous_lumped_formulas: true
  analytical_cylinder_effectiveness_test: true
  no_reaction_diffusion_test: true
  infinite_diffusion_limit_test: true
  grid_convergence:
    enabled: false
    radial_cells: [25, 50, 100, 200]
    relative_tolerance: 1.0e-3

output:
  root_directory: results
  run_directory_policy: run_name_plus_config_hash
  overwrite_existing_run: false
  format: csv
  save_config: true
  save_normalized_si_config: true
  save_metadata: true
  save_solver_statistics: true
  save_time: true
  save_coordinates: true
  save_concentrations: true
  save_average_concentrations: true
  save_reaction_rates: true
  save_effective_diffusivities: true
  save_surface_fluxes: true
  save_average_sources: true
  save_effectiveness_factor: true
  save_thiele_diagnostic: true
  save_conversion: true
  save_mass_balance_residual: true
  save_energy_balance_residual: false

plots:
  concentration_profiles: true
  concentrations_vs_time_at_center: true
  concentrations_vs_time_at_surface: true
  average_concentrations_vs_time: true
  reaction_rates: true
  effectiveness_factor: true
  thiele_test_diagnostic: true
  conversion: true
  grid_convergence: true
  selected_species: [C1, C2, C3, C4, C5, C6]
  selected_times: {value: [0.0, 5.0, 15.0, 60.0, 3600.0], unit: s}
  save_png: true
  show: true
