kinetics:
  model: article_apparent_demo
  state_basis: concentration
  native_parameter_basis: mole_fraction
  parameter_type: apparent
  demo_embedding:
    enabled: true
    normalization_concentration:
      mode: ideal_gas_total_at_bulk_conditions
      value: 608.306609
      unit: mol/m^3
      <<: *calculated
      comment: "C_ref=P/(RT); only a demo normalization at 3 MPa."
    source_time_coordinate: conditional_contact_time
    source_time_unit: min
    demo_time_mapping: "1 min conditional contact time -> 60 s elapsed time"
    warning: "This time mapping is not experimentally justified."
  acid_sites:
    model: constant_activity
    activity:
      value: 1.0
      unit: "1"
      <<: *demo
      comment: "Legacy-code assumption, not a physical concentration."
    bronsted_inventory:
      value: 0.091
      unit: mol/kg
      <<: *article_table_1
      comment: "91 micromol/g from Table 1."
    lewis_inventory:
      value: 0.031
      unit: mol/kg
      <<: *article_table_1
      comment: "31 micromol/g from Table 1."
    estimated_bronsted_concentration:
      value: 113.107345
      unit: mol/m^3
      <<: *calculated
      comment: "0.091 mol/kg times estimated particle density; not used as H+=1."
  arrhenius:
    gas_constant: {value: 8.314462618, unit: J/(mol*K), source_type: literature, source_reference: "CODATA", uncertainty: null, comment: "SI gas constant."}
    source_energy_unit: kcal/mol
    source_k0_reference_unit: 1/min
    note: "Table 4 labels k0 as min^-1 because source states are mole fractions."
  reactions:
    R1:
      reversible: true
      forward: {ln_k0: {value: 45.58, reference_unit: 1/min, <<: *article_table_4}, E: {value: 52.2, unit: kcal/mol, <<: *article_table_4}}
      reverse: {ln_k0: {value: 76.85, reference_unit: 1/min, <<: *article_table_4}, E: {value: 82.8, unit: kcal/mol, <<: *article_table_4}}
    R2:
      reversible: true
      forward: {ln_k0: {value: 47.39, reference_unit: 1/min, <<: *article_table_4}, E: {value: 52.5, unit: kcal/mol, <<: *article_table_4}}
      reverse: {ln_k0: {value: 0.01, reference_unit: 1/min, <<: *article_table_4}, E: {value: 1.2, unit: kcal/mol, <<: *article_table_4}}
    R3:
      reversible: true
      forward: {ln_k0: {value: 37.17, reference_unit: 1/min, <<: *article_table_4}, E: {value: 40.1, unit: kcal/mol, <<: *article_table_4}}
      reverse: {ln_k0: {value: 6.82, reference_unit: 1/min, <<: *article_table_4}, E: {value: 10.4, unit: kcal/mol, <<: *article_table_4}}
    R4:
      reversible: true
      forward: {ln_k0: {value: 29.66, reference_unit: 1/min, <<: *article_table_4}, E: {value: 33.3, unit: kcal/mol, <<: *article_table_4}}
      reverse: {ln_k0: {value: 2.32, reference_unit: 1/min, <<: *article_table_4}, E: {value: 1.6, unit: kcal/mol, <<: *article_table_4}}
    R5:
      reversible: true
      forward: {ln_k0: {value: 44.64, reference_unit: 1/min, <<: *article_table_4}, E: {value: 51.4, unit: kcal/mol, <<: *article_table_4}}
      reverse: {ln_k0: {value: 10.58, reference_unit: 1/min, <<: *article_table_4}, E: {value: 14.1, unit: kcal/mol, <<: *article_table_4}}
    R6: {reversible: false, forward: {ln_k0: {value: 44.01, reference_unit: 1/min, <<: *article_table_4}, E: {value: 50.4, unit: kcal/mol, <<: *article_table_4}}}
    R7: {reversible: false, forward: {ln_k0: {value: 33.25, reference_unit: 1/min, <<: *article_table_4}, E: {value: 40.2, unit: kcal/mol, <<: *article_table_4}}}
    R8: {reversible: false, forward: {ln_k0: {value: 43.65, reference_unit: 1/min, <<: *article_table_4}, E: {value: 51.0, unit: kcal/mol, <<: *article_table_4}}}
    R9:
