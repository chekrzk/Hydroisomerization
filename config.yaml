# Демонстрационная конфигурация Pt/SAPO-11 по статье:
# К. Ф. Коледина и др., Журнал физической химии, 2026, 100(1), 76–86.
# DOI: 10.7868/S3034553726010086
#
# RESULTS ARE NOT EXPERIMENTALLY VALIDATED
# Кинетика статьи является apparent: она идентифицирована по мольным долям
# и условному времени контакта. Совмещение с явной диффузией — только demo.

schema_version: "1.0"
model_version: V1
run_mode: demo
run_name: article_320C_demo
description: >-
  Демонстрационная внутренняя реакционно-диффузионная модель пористой
  цилиндрической гранулы Pt/SAPO-11 при 320 °C и 3.0 MPa.

references:
  article_2026:
    citation: >-
      Koledina K. F. et al. Kinetics and mechanism of the catalytic
      hydroisomerization of n-hexadecane in the presence of a Pt/SAPO-11
      catalyst. Russian Journal of Physical Chemistry, 2026, 100(1), 76-86.
    doi: 10.7868/S3034553726010086
    local_file: ../elibrary_89338019_60996835.pdf

model_warnings:
  - RESULTS ARE NOT EXPERIMENTALLY VALIDATED
  - Apparent article kinetics are not intrinsic kinetics.
  - The article uses mole fractions and conditional contact time, not physical pellet time.
  - Explicit diffusion plus article kinetics is a demo architecture case only.
  - Gas-phase Knudsen transport is a demo assumption; the experiment used a gas-liquid feed.
  - The V1 long-cylinder geometry is approximate because exact pellet dimensions are unavailable.

provenance_templates:
  article_conditions: &article_conditions
    source_type: literature
    source_reference: "Koledina et al. (2026), experimental section"
    uncertainty: null
    comment: "Value reported in the article."
  article_table_1: &article_table_1
    source_type: literature
    source_reference: "Koledina et al. (2026), Table 1"
    uncertainty: null
    comment: "Value reported in the article."
  article_table_4: &article_table_4
    source_type: literature
    source_reference: "Koledina et al. (2026), Table 4"
    uncertainty: null
    comment: "Apparent parameter fitted on mole-fraction data."
  calculated: &calculated
    source_type: estimated
    source_reference: "Calculated from Koledina et al. (2026) article values"
    uncertainty: null
    comment: "Calculated demo value; not independently measured."
  demo: &demo
    source_type: temporary_demo
    source_reference: "Demo assumption for software development"
    uncertainty: null
    comment: "Replace when measured or literature-supported data become available."

conditions:
  temperature:
    value: 593.15
    unit: K
    <<: *article_conditions
    comment: "320 °C; one of the article's experimental temperatures."
  pressure:
    value: 3.0e+6
    unit: Pa
    <<: *article_conditions
    comment: "Article reactor pressure: 3.0 MPa."
  experimental_phase:
    value: gas_liquid
    unit: "1"
    <<: *article_conditions
    comment: "The article describes a gas-liquid feed mixture."
  pellet_phase_model:
    value: gas_demo_approximation
    unit: "1"
    <<: *demo
    comment: "Only for exercising the Knudsen provider; not a validated phase model."

pellet:
  geometry: long_cylinder_1d_approximation
  equivalent_particle_diameter:
    value: 3.0e-3
    unit: m
    source_type: estimated
    source_reference: "Midpoint of the 2-4 mm particle size reported in Fig. 1"
    uncertainty: 1.0e-3
    comment: "Equivalent size, not a measured cylinder diameter."
  radius:
    value: 1.5e-3
    unit: m
    source_type: estimated
    source_reference: "Half of the 3 mm equivalent demo diameter"
    uncertainty: 5.0e-4
    comment: "Exact pellet radius is not reported."
  length:
    value: 3.0e-3
    unit: m
    <<: *demo
    comment: "Equivalent cylinder. L/(2R)=1, so the V1 long-cylinder assumption is not satisfied."
  bed_bulk_density:
    value: 642.0
    unit: kg/m^3
    <<: *article_conditions
    comment: "Bed bulk density only; forbidden as pellet particle density."
  skeletal_density:
    value: 2200.0
    unit: kg/m^3
    <<: *demo
    comment: "Engineering demo estimate for an aluminophosphate skeleton."
  total_pore_volume:
    value: 3.5e-4
    unit: m^3/kg
    <<: *calculated
    comment: "0.07 + 0.28 cm^3/g = 0.35 cm^3/g."
  particle_density:
    value: 1242.937853
    unit: kg/m^3
    <<: *calculated
    comment: "rho_p = 1/(V_pore + 1/rho_s), rho_s=2200 kg/m^3."
  porosity:
    mode: from_skeletal_density_and_pore_volume
    value: 0.435028249
    unit: "1"
    <<: *calculated
    comment: "epsilon = V_pore/(V_pore + 1/rho_s)."
  bet_surface_area:
    value: 2.60e+5
    unit: m^2/kg
    <<: *article_table_1
    comment: "260 m^2/g converted to SI."
  micropore_volume:
    value: 7.0e-5
    unit: m^3/kg
    <<: *article_table_1
    comment: "0.07 cm^3/g converted to SI."
  mesopore_volume:
    value: 2.8e-4
    unit: m^3/kg
    <<: *article_table_1
    comment: "0.28 cm^3/g converted to SI."
  pore_radius:
    mode: calculated_from_total_pore_volume_and_bet
    value: 2.692307692e-9
    unit: m
    <<: *calculated
    comment: "Effective estimate r_pore=2*V_pore/S_BET."
  tortuosity:
    value: 3.0
    unit: "1"
    <<: *demo
    comment: "Unmeasured demo estimate."

